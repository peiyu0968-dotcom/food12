[project]
name = "food-agent"
version = "0.1.0"
description = "Discord bot: food photo -> claude -p -> Excel log"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
food-agent = "food_agent.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
