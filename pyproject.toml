[project]
name = "stylemate-ai"
version = "0.1.0"
description = "Discord bot: StyleMate AI - wardrobe assistant (clothing photo -> claude -p -> per-user Excel wardrobe)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py>=2.4",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
stylemate = "stylemate_ai.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stylemate_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
